<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1301c" />
      <stop offset="55%" stop-color="#eb6834" />
      <stop offset="100%" stop-color="#f0a600" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#sunset)" />
  <!-- Compass rose, echoing CompassMark.tsx's in-app brand mark — an 8-point
       star (primary N/S/E/W points solid, secondary points at half opacity)
       rather than its thin-stroke ring/ticks, which vanish at favicon sizes. -->
  <g fill="#f8fafd">
    <polygon points="32,8 38.5,32 32,56 25.5,32" />
    <polygon points="8,32 32,25.5 56,32 32,38.5" opacity="0.55" />
  </g>
  <circle cx="32" cy="32" r="3.6" fill="#15213a" />
</svg>
